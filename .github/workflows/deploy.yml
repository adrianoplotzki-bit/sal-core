name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sal-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate secrets
        run: |
          test -n "${{ secrets.FTP_HOST }}" || (echo "::error::Missing secret: FTP_HOST" && exit 1)
          test -n "${{ secrets.FTP_USER }}" || (echo "::error::Missing secret: FTP_USER" && exit 1)
          test -n "${{ secrets.FTP_PASS }}" || (echo "::error::Missing secret: FTP_PASS" && exit 1)
          test -n "${{ secrets.REMOTE_DIR_STAGING }}" || (echo "::error::Missing secret: REMOTE_DIR_STAGING" && exit 1)

      - name: Deploy to STAGING via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          local-dir: ./
          protocol: ftp
          exclude: |
            .git*
            .github/**

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      # reusa o mesmo local-dir (./) e server-dir; a action só envia o que mudou (o flag)
      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          local-dir: ./
          protocol: ftp
          exclude: |
            .git*
            .github/**

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate secrets (prod)
        run: |
          test -n "${{ secrets.FTP_HOST }}" || (echo "::error::Missing secret: FTP_HOST" && exit 1)
          test -n "${{ secrets.FTP_USER }}" || (echo "::error::Missing secret: FTP_USER" && exit 1)
          test -n "${{ secrets.FTP_PASS
