name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sal-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to STAGING via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          local-dir: ./
          protocol: ftp
          security: loose
          exclude: |
            .git*
            .github/**

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/../../
          local-dir: .
          protocol: ftp
          security: loose
          exclude: |
            **/*
          include: |
            sal-deploy.flag

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to PROD via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_PROD }}/
          local-dir: ./
          protocol: ftp
          security: loose
          exclude: |
            .git*
            .github/**

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_PROD }}/../../
          local-dir: .
          protocol: ftp
          security: loose
          exclude: |
            **/*
          include: |
            sal-deploy.flag