name: Deploy SAL Core

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to STAGING via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          local-dir: ./
          # Se o host não aceitar FTPS, descomente:
          # protocol: ftp
          # security: loose

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/../../
          local-dir: .
          exclude: |
            **/*
          include: |
            sal-deploy.flag

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to PROD via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_PROD }}/
          local-dir: ./

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR_PROD }}/../../
          local-dir: .
          exclude: |
            **/*
          include: |
            sal-deploy.flag