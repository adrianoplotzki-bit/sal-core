name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to STAGING via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          exclude: |
            .git*
            .github/**
            **/.DS_Store

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          exclude: |
            .git*
            .github/**
            **/.DS_Store

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to PROD via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.REMOTE_DIR_PROD }}/
          exclude: |
            .git*
            .github/**
            **/.DS_Store
