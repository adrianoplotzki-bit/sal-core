name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
      - 'theme/**'
  workflow_dispatch:

# -----------------------------------------------------------------------------
# Auth: SSH key (SFTP_KEY) ao invés de senha. Servidor Hetzner roda com
# PasswordAuthentication=no, então só funciona via chave.
# -----------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Plugin: deploy para staging (push em branch staging)
  # ---------------------------------------------------------------------------
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Debug SSH connectivity (TEMP)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
        run: |
          echo "--- key file ---"
          ls -la ~/.ssh/
          echo "--- key first/last line + line count ---"
          head -1 ~/.ssh/deploy_key
          tail -1 ~/.ssh/deploy_key
          wc -l ~/.ssh/deploy_key
          echo "--- known_hosts ---"
          wc -l ~/.ssh/known_hosts
          echo "--- ssh test (single attempt, no password fallback, 15s timeout) ---"
          ssh -vvv \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o NumberOfPasswordPrompts=0 \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=accept-new \
            "${SFTP_USER}@${SFTP_HOST}" \
            "echo SUCCESS_FROM_RUNNER"

      - name: Deploy plugin to STAGING via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_STAGING }}
        run: |
          sudo apt-get install -y lftp
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 1
          set sftp:connect-program "ssh -a -x -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=accept-new -i $HOME/.ssh/deploy_key"
          open sftp://$SFTP_USER@$SFTP_HOST
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            ./ $REMOTE_DIR/
          bye
          LFTP_CMDS

      - name: Upload deploy flag
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_STAGING }}
        run: |
          echo "deployed $(date -u)" > sal-deploy.flag
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/deploy_key"
          open sftp://$SFTP_USER@$SFTP_HOST
          put sal-deploy.flag -o $REMOTE_DIR/sal-deploy.flag
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Plugin: deploy para produção (manual via workflow_dispatch)
  # ---------------------------------------------------------------------------
  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy plugin to PROD via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_PROD }}
        run: |
          sudo apt-get install -y lftp
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/deploy_key"
          open sftp://$SFTP_USER@$SFTP_HOST
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            ./ $REMOTE_DIR/
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Tema: deploy para staging (push em branch staging)
  # ---------------------------------------------------------------------------
  deploy-theme-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy theme to STAGING via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_THEMES_STAGING }}
        run: |
          sudo apt-get install -y lftp
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/deploy_key"
          open sftp://$SFTP_USER@$SFTP_HOST
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            --exclude-glob .gitkeep \
            ./theme/sal-theme/ $REMOTE_DIR/sal-theme/
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Tema: deploy para produção (manual via workflow_dispatch)
  # ---------------------------------------------------------------------------
  deploy-theme-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy theme to PROD via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_THEMES_PROD }}
        run: |
          sudo apt-get install -y lftp
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -i $HOME/.ssh/deploy_key"
          open sftp://$SFTP_USER@$SFTP_HOST
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            --exclude-glob .gitkeep \
            ./theme/sal-theme/ $REMOTE_DIR/sal-theme/
          bye
          LFTP_CMDS
