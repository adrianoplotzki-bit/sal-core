name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
      - 'theme/**'
  workflow_dispatch:

# -----------------------------------------------------------------------------
# Auth: SSH key (SFTP_KEY) ao invés de senha. Servidor Hetzner roda com
# PasswordAuthentication=no, então só funciona via chave.
#
# Importante: lftp não passa o user do "open sftp://user@host" para o
# connect-program. Por isso precisa "-l $SFTP_USER" explícito na string do
# sftp:connect-program — senão ssh usa o user local do runner ("runner").
#
# Sem staging real: push em "staging" e workflow_dispatch executam o mesmo
# job, deployando no mesmo path. Os sufixos -staging/-production foram
# removidos em 2026-05-06.
# -----------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Plugin: deploy automático em push, manual em workflow_dispatch
  # ---------------------------------------------------------------------------
  deploy-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH key
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy plugin via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_PLUGIN }}
        run: |
          sudo apt-get install -y lftp
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -l $SFTP_USER -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=accept-new"
          open sftp://$SFTP_USER@$SFTP_HOST
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            ./ $REMOTE_DIR/
          bye
          LFTP_CMDS

      - name: Upload deploy flag
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_PLUGIN }}
        run: |
          echo "deployed $(date -u)" > sal-deploy.flag
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -l $SFTP_USER -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=accept-new"
          open sftp://$SFTP_USER@$SFTP_HOST
          put sal-deploy.flag -o $REMOTE_DIR/sal-deploy.flag
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Tema: deploy automático em push, manual em workflow_dispatch
  # ---------------------------------------------------------------------------
  deploy-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup SSH key
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy theme via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_THEME }}
        run: |
          sudo apt-get install -y lftp
          lftp <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          set sftp:connect-program "ssh -a -x -l $SFTP_USER -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o NumberOfPasswordPrompts=0 -o StrictHostKeyChecking=accept-new"
          open sftp://$SFTP_USER@$SFTP_HOST
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            --exclude-glob .gitkeep \
            ./theme/sal-theme/ $REMOTE_DIR/sal-theme/
          bye
          LFTP_CMDS
