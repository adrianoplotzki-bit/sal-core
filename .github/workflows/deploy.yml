name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
      - 'theme/**'
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Plugin: deploy para staging (push em branch staging)
  # ---------------------------------------------------------------------------
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy plugin to STAGING via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_STAGING }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            ./ $REMOTE_DIR/
          bye
          LFTP_CMDS

      - name: Upload deploy flag
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_STAGING }}
        run: |
          echo "deployed $(date -u)" > sal-deploy.flag
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" <<LFTP_CMDS
          set sftp:auto-confirm yes
          put sal-deploy.flag -o $REMOTE_DIR/sal-deploy.flag
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Plugin: deploy para produção (manual via workflow_dispatch)
  # ---------------------------------------------------------------------------
  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy plugin to PROD via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_PROD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            ./ $REMOTE_DIR/
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Tema: deploy para staging (push em branch staging)
  # ---------------------------------------------------------------------------
  deploy-theme-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme to STAGING via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_THEMES_STAGING }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            --exclude-glob .gitkeep \
            ./theme/sal-theme/ $REMOTE_DIR/sal-theme/
          bye
          LFTP_CMDS

  # ---------------------------------------------------------------------------
  # Tema: deploy para produção (manual via workflow_dispatch)
  # ---------------------------------------------------------------------------
  deploy-theme-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme to PROD via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR_THEMES_PROD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$SFTP_USER","$SFTP_PASS" "sftp://$SFTP_HOST" <<LFTP_CMDS
          set sftp:auto-confirm yes
          set net:max-retries 3
          mirror --reverse --delete --verbose \
            --exclude-glob .git \
            --exclude-glob .gitignore \
            --exclude-glob .github \
            --exclude-glob .DS_Store \
            --exclude-glob .gitkeep \
            ./theme/sal-theme/ $REMOTE_DIR/sal-theme/
          bye
          LFTP_CMDS

