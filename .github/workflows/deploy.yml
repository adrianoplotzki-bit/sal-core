name: Deploy SAL Core

on:
  push:
    branches: [staging]
    paths:
      - 'sal-core.php'
      - 'js/**'
      - 'css/**'
      - '.github/workflows/deploy.yml'
      - 'theme/**'
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to STAGING via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: sftp
          local-dir: ./
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          exclude: |
            .git*
            .github/**
            **/.DS_Store

      - name: Touch deploy flag
        run: echo "deployed $(date -u)" > sal-deploy.flag

      - name: Upload deploy flag
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: sftp
          local-dir: ./
          server-dir: ${{ secrets.REMOTE_DIR_STAGING }}/
          exclude: |
            .git*
            .github/**
            **/.DS_Store

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to PROD via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: sftp
          local-dir: ./
          server-dir: ${{ secrets.REMOTE_DIR_PROD }}/
          exclude: |
            .git*
            .github/**
            **/.DS_Store

  # ---------------------------------------------------------------------------
  # Tema: deploy para staging (push em branch staging, arquivos theme/**)
  # ---------------------------------------------------------------------------
  deploy-theme-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme to STAGING via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: sftp
          local-dir: ./theme/sal-theme/
          server-dir: ${{ secrets.REMOTE_DIR_THEMES_STAGING }}/sal-theme/
          exclude: |
            .git*
            .github/**
            **/.DS_Store
            **/.gitkeep

  # ---------------------------------------------------------------------------
  # Tema: deploy para produção (manual via workflow_dispatch)
  # ---------------------------------------------------------------------------
  deploy-theme-production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy theme to PROD via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASS }}
          protocol: sftp
          local-dir: ./theme/sal-theme/
          server-dir: ${{ secrets.REMOTE_DIR_THEMES_PROD }}/sal-theme/
          exclude: |
            .git*
            .github/**
            **/.DS_Store
            **/.gitkeep
